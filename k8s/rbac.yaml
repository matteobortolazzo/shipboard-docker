# RBAC in Kubernetes: chi (ServiceAccount), cosa (Role), dove (namespace), collegati dal RoleBinding.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lettore
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: legge-pod
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lettore-legge-pod
subjects:
  - kind: ServiceAccount
    name: lettore
    namespace: default
roleRef:
  kind: Role
  name: legge-pod
  apiGroup: rbac.authorization.k8s.io
