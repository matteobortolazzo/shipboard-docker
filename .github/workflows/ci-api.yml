name: ci-api

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-api.yml"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login a GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build e push dell'immagine
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-api
          # Due tag: lo SHA identifica la versione (rollback, deploy precisi), latest e' comodo a mano.
          docker build --build-arg APP_VERSION=$GITHUB_SHA -t $IMAGE:$GITHUB_SHA -t $IMAGE:latest ./src/ShipBoard.Api
          docker push $IMAGE:$GITHUB_SHA
          docker push $IMAGE:latest

  deploy:
    needs: api
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy su Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          # imgURL: Render usa l'immagine con lo SHA di questo commit invece di riscaricare latest.
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-api:$GITHUB_SHA"
          curl -fsS -X POST "$HOOK&imgURL=$(jq -rn --arg v "$IMAGE" '$v|@uri')"

  # Secondo deploy, in parallelo a Render: App Service con login OIDC (nessuna password su GitHub).
  # Parte solo se la variabile di repository AZURE_WEBAPP_NAME esiste: chi non ha Azure resta verde.
  deploy-azure:
    needs: api
    if: github.event_name == 'push' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/info
    permissions:
      contents: read
      id-token: write   # per chiedere a GitHub il token OIDC da scambiare con Azure
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Nome dell'immagine
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-api:$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Deploy dell'immagine con lo SHA del commit
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          images: ${{ env.IMAGE }}

      - name: Smoke test
        env:
          URL: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
        run: |
          # Il piano F1 si addormenta: fino a 3 minuti per scaricare l'immagine e ripartire.
          for i in $(seq 1 36); do
            if curl -fsS "$URL/info" | grep -q "$GITHUB_SHA"; then
              echo "Online con la versione $GITHUB_SHA"; exit 0
            fi
            sleep 5
          done
          echo "::error::$URL/info non mostra la versione $GITHUB_SHA"; exit 1
